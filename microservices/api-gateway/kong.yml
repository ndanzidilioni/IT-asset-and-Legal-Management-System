_format_version: "3.0"
_transform: true

services:
  # User Management Service
  - name: user-service
    url: http://user-service:8000
    routes:
      - name: user-routes
        strip_path: true
        paths:
          - /api/users
          - /api/auth
    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://frontend:3000"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - X-Auth-Token
            - Authorization
          exposed_headers:
            - X-Auth-Token
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000

